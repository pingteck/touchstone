name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # lint-version-bump.sh diffs against main / the pre-push commit
      - name: Run all lints
        run: ./tests/lint.sh
        env:
          # On a push to main, compare against the commit before the push; on a PR the
          # lint uses its default (merge-base with origin/main).
          LINT_BASE: ${{ github.event_name == 'push' && github.event.before || '' }}
